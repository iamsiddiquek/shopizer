# Mail sender defaults for local development.
# Production credentials must come from environment variables.
mailSender.protocol=${MAIL_SENDER_PROTOCOL:smtp}
mailSender.host=${MAIL_SENDER_HOST:localhost}
mailSender.port=${MAIL_SENDER_PORT:1025}
mailSender.username=${MAIL_SENDER_USERNAME:}
mailSender.password=${MAIL_SENDER_PASSWORD:}
mailSender.mail.smtp.auth=${MAIL_SENDER_SMTP_AUTH:false}
mail.smtp.starttls.enable=${MAIL_SENDER_STARTTLS_ENABLE:false}
