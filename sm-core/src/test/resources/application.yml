# MIGRATION NOTE: Converted the sm-core test application properties to YAML while preserving the existing test wiring.
spring:
  jpa:
    hibernate:
      use-new-id-generator-mappings: false
    properties:
      hibernate:
        default_schema: SALESMANAGER
  main:
    allow-bean-definition-overriding: true
    # MIGRATION NOTE: Preserves legacy circular reference handling in sm-core tests after removing Spring XML.
    allow-circular-references: true

logging:
  level:
    org.springframework.web: ERROR
    org.springframework.security: ERROR
    com.shopizer: INFO
    org.hibernate: ERROR
    org.apache.http.headers: ERROR
    org.apache.http.client: ERROR
    org.apache.http.impl: ERROR
    org.apache.http.wire: ERROR
    com.salesmanager: ERROR
    # MIGRATION NOTE: Reduce Boot 4 test warning noise from unchanged fixed-size Hikari settings without altering datasource behavior.
    com.zaxxer.hikari.HikariConfig: ERROR

shopizer:
  test: true
