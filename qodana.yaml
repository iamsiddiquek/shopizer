#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#
version: "1.0"
#Specify inspection profile for code analysis
profile:
  name: qodana.starter
#Enable inspections
#include:
#  - name: <SomeEnabledInspectionId>
#Disable inspections
#exclude:
#  - name: <SomeDisabledInspectionId>
#    paths:
#      - <path/where/not/run/inspection>
projectJDK: "17" #(Applied in CI/CD pipeline)
#Execute shell command before Qodana execution (Applied in CI/CD pipeline)
#bootstrap: sh ./prepare-qodana.sh
#Install IDE plugins before Qodana execution (Applied in CI/CD pipeline)
#plugins:
#  - id: <plugin.id> #(plugin id can be found at https://plugins.jetbrains.com)
#Specify Qodana linter for analysis (Applied in CI/CD pipeline)
linter: jetbrains/qodana-jvm:2024.3
include:
  - name: SizeReplaceableByIsEmpty
  - name: StringBufferReplaceableByString
  - name: CommentedOutCode
  - name: TrivialStringConcatenation
  - name: DanglingJavadoc
  - name: JavadocReference
  - name: DefaultAnnotationParam
  - name: Deprecation
  - name: DeprecatedIsStillUsed
  - name: DuplicatedCode
  - name: FieldCanBeLocal
  - name: FieldMayBeFinal
  - name: JavadocDeclaration
  - name: ManualMinMaxCalculation
  - name: ExtractMethodRecommender
  - name: DuplicateExpressions
  - name: NonFinalFieldInEnum
  - name: TrivialIf
  - name: UnnecessaryLocalVariable
  - name: RedundantCast
  - name: SimplifyStreamApiCallChains
  - name: UnnecessaryContinue
  - name: UnnecessaryReturn
  - name: UnnecessaryToStringCall
  - name: UnnecessaryModifier
  - name: UNUSED_IMPORT
