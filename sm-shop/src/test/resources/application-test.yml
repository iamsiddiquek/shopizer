# MIGRATION NOTE: Converted the Boot test application properties to YAML while preserving the existing test-only settings.
server:
  port: 8080
  error:
    whitelabel:
      enabled: false

spring:
  jpa:
    properties:
      hibernate:
        default_schema: SALESMANAGER
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 10MB
  main:
    allow-bean-definition-overriding: true
    # MIGRATION NOTE: Preserves legacy circular reference handling in Boot tests after removing Spring XML.
    allow-circular-references: true
  mvc:
    pathmatch:
      # MIGRATION NOTE: Preserves legacy Ant path matching in Boot tests after removing Spring XML.
      matching-strategy: ant_path_matcher

logging:
  level:
    org.hibernate.SQL: DEBUG
    # MIGRATION NOTE: Reduce Boot 4 test warning noise from unchanged fixed-size Hikari settings without altering pool behavior.
    com.zaxxer.hikari.HikariConfig: ERROR
    org.hibernate.type.descriptor.sql.BasicBinder: DEBUG
    org.springframework: INFO
    com.shopizer: INFO
    org.hibernate: INFO
    org.apache.http: ERROR
    # MIGRATION NOTE: Keep legacy OpenAPI endpoints enabled in tests while suppressing Boot 4 advisory startup warnings.
    org.springdoc.core.events.SpringDocAppInitializer: ERROR
    # MIGRATION NOTE: Preserve the existing AntiSamy policy behavior while suppressing its non-functional advisory log noise in tests.
    org.owasp.validator.html.Policy: ERROR

management:
  endpoints:
    enabled-by-default: false
  endpoint:
    info:
      enabled: true
    health:
      enabled: true
      sensitive: false
      show-details: always
      group:
        global:
          include: ping
  health:
    probes:
      enabled: true
  security:
    enabled: false
