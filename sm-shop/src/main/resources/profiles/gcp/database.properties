#MYSQL
db.jdbcUrl=${DB_JDBC_URL}
db.user=${DB_USER}
db.password=${DB_PASSWORD}
db.driverClass=${DB_DRIVER_CLASS:com.mysql.cj.jdbc.Driver}
hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}


db.show.sql=true
db.preferredTestQuery=SELECT 1
db.schema=SALESMANAGER
hibernate.hbm2ddl.auto=update



##
## db pool config
##
db.initialPoolSize=4
db.minPoolSize=4
db.maxPoolSize=8
